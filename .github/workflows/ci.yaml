

name: CI Pipeline 

on: push

jobs:
  project-testing: 
    runs-on: ubuntu-latest  

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip 
          pip install -r requirements.txt

      - name: run pipeline
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          dvc repro

      - name: Run model tests
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          python -m unittest tests/test_model.py

      - name: Promote model to production
        if: success()
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python scripts/promote_model.py

      - name: Run Flask app tests
        if: success()
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python -m unittest tests/test_flask_app.py

      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Docker image
        if: success() 
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/emotion2:latest .

      - name: Push Docker image to Docker Hub
        if: success()
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/emotion2:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        timeout-minutes: 10
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DAGSHUB_PAT
          timeout: 60s
          command_timeout: 9m
          script: |
            set -e

            echo "1. Checking disk space..."
            df -h /

            echo "2. Removing old application container..."
            docker rm -f my-app || true

            echo "3. Removing unused Docker images..."
            docker image prune -a -f

            echo "4. Checking disk space after cleanup..."
            df -h /
            docker system df

            echo "5. Pulling latest Docker image..."
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/emotion2:latest

            echo "6. Starting updated application..."
            docker run -d \
              --restart unless-stopped \
              --name my-app \
              -p 80:5000 \
              -e DAGSHUB_PAT="$DAGSHUB_PAT" \
              ${{ secrets.DOCKER_HUB_USERNAME }}/emotion2:latest

            echo "7. Checking container status..."
            docker ps --filter name=my-app

            echo "8. Recent application logs..."
            docker logs --tail 30 my-app