

name: CI Pipeline 

on: push

jobs:
  project-testing: 
    runs-on: ubuntu-latest  

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip 
          pip install -r requirements.txt

      - name: run pipeline
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          dvc repro

      - name: Run model tests
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          python -m unittest tests/test_model.py

      - name: Promote model to production
        if: success()
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python scripts/promote_model.py

      - name: Run Flask app tests
        if: success()
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python -m unittest tests/test_flask_app.py

      - name: Login to AWS ECR
        run: |
            aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 825370131926.dkr.ecr.us-east-1.amazonaws.com
      - name: Build Docker image
        run: |
            docker build -t mlops-ecr .
      - name: Tag Docker image
        run: |
            docker tag mlops-ecr:latest 825370131926.dkr.ecr.us-east-1.amazonaws.com/mlops-ecr:latest
      - name: Push Docker image to AWS ECR
        run: |
            docker push 825370131926.dkr.ecr.us-east-1.amazonaws.com/mlops-ecr:latest